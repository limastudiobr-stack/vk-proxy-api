name: VK Extractor API

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'URL do video do VK'
        required: true
        type: string

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Extraction Script
        run: python extract.py "${{ github.event.inputs.video_url }}" > result.json

      - name: Commit and Push Result
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add result.json
          git commit -m "Update extraction result" || exit 0
          git push
